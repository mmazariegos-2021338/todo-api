# Configuración para el análisis con SonarQube/SonarCloud.
sonar.projectKey=todo-api
sonar.projectName=todo-api
sonar.projectVersion=1.0

# Carpeta con el código fuente a analizar.
sonar.sources=src
# Excluimos los tests del análisis de "sources" y los usamos solo como tests.
sonar.exclusions=**/*.test.js
sonar.tests=src
sonar.test.inclusions=**/*.test.js

# Reporte de cobertura (generado por "npm test" con jest --coverage).
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.sourceEncoding=UTF-8
